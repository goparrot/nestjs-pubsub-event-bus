name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  commitlint:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lints Pull Request commits
        uses: wagoid/commitlint-github-action@v5

  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
        nestjs-version: [10, 11]
        rabbitmq-version: ['3.13.3', '4.1.0']

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    services:
      rabbitmq:
        image: heidiks/rabbitmq-delayed-message-exchange:${{ matrix.rabbitmq-version }}-management
        ports:
          - 5672:5672
        options:
          --health-cmd "rabbitmq-diagnostics -q check_virtual_hosts"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }} with NestJS ${{ matrix.nestjs-version }} and RabbitMQ ${{ matrix.rabbitmq-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: |
          node --version
          npm --version

      - name: Install npm dependencies
        run: npm ci --progress=false --loglevel=warn --ignore-scripts

      - name: Install NestJS ${{ matrix.nestjs-version }}
        run: |
          npm install --save-dev \
            @nestjs/common@^${{ matrix.nestjs-version }} \
            @nestjs/core@^${{ matrix.nestjs-version }} \
            @nestjs/cqrs@^${{ matrix.nestjs-version }} \
            @nestjs/testing@^${{ matrix.nestjs-version }}

      - name: Type check
        run: npm run typecheck

      - name: Dry run of publishing
        run: npm run publish:dev:dry

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm run coverage

      - name: Run Coveralls
        uses: coverallsapp/github-action@master
        if: matrix.node-version == 18 && matrix.nestjs-version == 11 && matrix.rabbitmq-version == '4.1.0'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
