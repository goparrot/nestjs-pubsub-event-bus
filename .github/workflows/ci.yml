name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  commitlint:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lints Pull Request commits
        uses: wagoid/commitlint-github-action@v5

  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [16, 20, 22, 24]
        nestjs-version: [8, 9, 10, 11]
        exclude:
          # @nestjs/core 11 needs Node.js 20 or later
          - node-version: 16
            nestjs-version: 11
        include:
          # The decorators of NestJS 8 don't type check with TypeScript 5
          - nestjs-version: 8
            typescript-version: ~4.9.5

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    services:
      rabbitmq:
        image: heidiks/rabbitmq-delayed-message-exchange
        ports:
          - 5672:5672
        options:
          --health-cmd "rabbitmq-diagnostics -q check_virtual_hosts"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }} with NestJS ${{ matrix.nestjs-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: |
          node --version
          npm --version

      - name: Install npm dependencies
        run: npm ci --progress=false --loglevel=warn --ignore-scripts

      - name: Install NestJS ${{ matrix.nestjs-version }}
        run: |
          npm install --save-dev --progress=false --loglevel=warn --ignore-scripts \
            @nestjs/common@^${{ matrix.nestjs-version }} \
            @nestjs/core@^${{ matrix.nestjs-version }} \
            @nestjs/cqrs@^${{ matrix.nestjs-version }} \
            @nestjs/testing@^${{ matrix.nestjs-version }}

      - name: Install TypeScript ${{ matrix.typescript-version }}
        if: matrix.typescript-version
        run: npm install --save-dev --progress=false --loglevel=warn --ignore-scripts typescript@${{ matrix.typescript-version }}

      - name: Type check
        run: npm run typecheck

      - name: Dry run of publishing
        run: npm run publish:dev:dry

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm run coverage

      - name: Run Coveralls
        uses: coverallsapp/github-action@master
        if: startsWith(matrix.node-version, '18.')
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
